<div class="page-header">
  <h1 class="page-title">
    <i class="bi bi-plus-circle me-2"></i>New Ticket
  </h1>
  <a routerLink="/tickets"
     class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left me-2"></i>Back to Tickets
  </a>
</div>

<div class="row">
  <div class="col-md-8">
    <div class="card">
      <div class="card-header">Ticket Details</div>
      <div class="card-body">

        <div class="mb-3">
          <label class="form-label">
            Subject <span class="text-danger">*</span>
          </label>
          <input type="text" class="form-control"
            placeholder="Brief description of the issue"
            [(ngModel)]="subject"
            [disabled]="isSubmitting">
        </div>

        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea class="form-control" rows="5"
            placeholder="Provide detailed information about the issue..."
            [(ngModel)]="description"
            [disabled]="isSubmitting">
          </textarea>
        </div>

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">
              Category <span class="text-danger">*</span>
            </label>
            <select class="form-select"
              [(ngModel)]="categoryId"
              [disabled]="isSubmitting">
              <option [ngValue]="null">
                Select a category
              </option>
              @for (cat of categories; track cat.id) {
                <option [ngValue]="cat.id">
                  {{ cat.name }}
                </option>
              }
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">Priority</label>
            <select class="form-select"
              [(ngModel)]="priority"
              [disabled]="isSubmitting">
              @for (p of priorities; track p) {
                <option [value]="p">{{ p }}</option>
              }
            </select>
          </div>
        </div>

        <div class="mt-3">
          <label class="form-label">
            Assign To (Optional)
          </label>
          <select class="form-select"
            [(ngModel)]="assignedToId"
            [disabled]="isSubmitting">
            <option [ngValue]="null">
              Leave unassigned
            </option>
            @for (user of users; track user.id) {
              <option [ngValue]="user.id">
                {{ user.firstName }} {{ user.lastName }}
                — {{ user.departmentName }}
              </option>
            }
          </select>
        </div>

      </div>
      <div class="card-footer d-flex gap-2">
        <button class="btn btn-primary"
          (click)="onSubmit()"
          [disabled]="isSubmitting">
          @if (isSubmitting) {
            <span class="spinner-border 
                         spinner-border-sm me-2"></span>
            Submitting...
          } @else {
            <i class="bi bi-check-circle me-2"></i>
            Submit Ticket
          }
        </button>
        <a routerLink="/tickets"
           class="btn btn-outline-secondary">
          Cancel
        </a>
      </div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="card">
      <div class="card-header">Tips</div>
      <div class="card-body">
        <ul class="tips-list">
          <li>
            <i class="bi bi-lightbulb text-warning me-2"></i>
            Be specific in the subject line
          </li>
          <li>
            <i class="bi bi-lightbulb text-warning me-2"></i>
            Include error messages if any
          </li>
          <li>
            <i class="bi bi-lightbulb text-warning me-2"></i>
            Mention steps to reproduce the issue
          </li>
          <li>
            <i class="bi bi-lightbulb text-warning me-2"></i>
            Set priority based on business impact
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
