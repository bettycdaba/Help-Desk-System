<div class="login-page">
  <div class="login-container" style="max-width:420px">

    <div class="login-header">
      <div class="login-logo">
        <i class="bi bi-key"></i>
      </div>
      <h1 class="login-title">Forgot Password</h1>
      <p class="login-subtitle">
        Enter your email to receive a temporary password
      </p>
    </div>

    <div class="login-card">

      @if (successMessage) {
        <div class="alert alert-success">
          <i class="bi bi-check-circle me-2"></i>
          {{ successMessage }}
          <p class="mt-2 mb-0 small">
            Redirecting to reset page...
          </p>
        </div>
      } @else {

        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control"
            placeholder="Enter your registered email"
            [(ngModel)]="email"
            (keyup.enter)="onSubmit()"
            [disabled]="isLoading">
        </div>

        @if (errorMessage) {
          <div class="alert alert-danger py-2 mb-3">
            <i class="bi bi-exclamation-circle me-2"></i>
            {{ errorMessage }}
          </div>
        }

        <button class="btn btn-primary w-100 login-btn"
          (click)="onSubmit()"
          [disabled]="isLoading">
          @if (isLoading) {
            <span class="spinner-border 
                         spinner-border-sm me-2"></span>
            Sending...
          } @else {
            <i class="bi bi-send me-2"></i>
            Send Temporary Password
          }
        </button>

      }

      <div class="d-flex justify-content-between mt-3">
        <a routerLink="/login" class="text-muted small">
          <i class="bi bi-arrow-left me-1"></i>
          Back to Login
        </a>
        <a routerLink="/register" class="text-muted small">
          Create Account
        </a>
      </div>

    </div>
  </div>
</div>
