<div class="login-page">
  <div class="login-container">
    <div class="login-header">
      <div class="login-logo"><i class="bi bi-envelope-check"></i></div>
      <h1 class="login-title">Verify your email</h1>
      <p class="login-subtitle">Enter the six-digit code we sent to your email.</p>
    </div>

    <div class="login-card">
      <div class="mb-3">
        <label class="form-label">Email address</label>
        <input type="email" class="form-control" [(ngModel)]="email" [disabled]="isLoading">
      </div>
      <div class="mb-3">
        <label class="form-label">Verification code</label>
        <input type="text" class="form-control verification-code" maxlength="6" inputmode="numeric"
          autocomplete="one-time-code" [(ngModel)]="code" (keyup.enter)="onVerify()" [disabled]="isLoading">
      </div>

      @if (errorMessage) {
        <div class="alert alert-danger py-2">{{ errorMessage }}</div>
      }

      <button class="btn btn-primary w-100 login-btn" (click)="onVerify()" [disabled]="isLoading">
        @if (isLoading) { Verifying... } @else { Verify email }
      </button>
      <button class="btn btn-link w-100 mt-2" (click)="onResend()" [disabled]="isLoading || isResending">
        @if (isResending) { Sending a new code... } @else { Resend code }
      </button>
      <p class="text-center mt-3 mb-0 text-muted small">
        <a routerLink="/login" class="text-primary">Back to login</a>
      </p>
    </div>
  </div>
</div>
