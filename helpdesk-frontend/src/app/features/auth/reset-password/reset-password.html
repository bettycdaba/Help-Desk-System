<div class="login-page">
  <div class="login-container" style="max-width:440px">

    <div class="login-header">
      <div class="login-logo">
        <i class="bi bi-shield-lock"></i>
      </div>
      <h1 class="login-title">Reset Password</h1>
      <p class="login-subtitle">
        Enter the temporary password from your email
      </p>
    </div>

    <div class="login-card">

      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control"
          [(ngModel)]="email"
          [disabled]="isLoading"
          placeholder="Your registered email">
      </div>

      <div class="mb-3">
        <label class="form-label">Temporary Password</label>
        <input [type]="showPasswords ? 'text' : 'password'"
          class="form-control"
          [(ngModel)]="temporaryPassword"
          [disabled]="isLoading"
          placeholder="From your email">
      </div>

      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input [type]="showPasswords ? 'text' : 'password'"
          class="form-control"
          [(ngModel)]="newPassword"
          [disabled]="isLoading"
          placeholder="Minimum 8 characters">
      </div>

      <div class="mb-3">
        <label class="form-label">Confirm New Password</label>
        <input [type]="showPasswords ? 'text' : 'password'"
          class="form-control"
          [(ngModel)]="confirmPassword"
          [disabled]="isLoading">
      </div>

      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input"
          id="showPwd"
          [(ngModel)]="showPasswords">
        <label class="form-check-label" for="showPwd">
          Show passwords
        </label>
      </div>

      @if (errorMessage) {
        <div class="alert alert-danger py-2 mb-3">
          <i class="bi bi-exclamation-circle me-2"></i>
          {{ errorMessage }}
        </div>
      }

      <button class="btn btn-primary w-100 login-btn"
        (click)="onSubmit()"
        [disabled]="isLoading">
        @if (isLoading) {
          <span class="spinner-border 
                       spinner-border-sm me-2"></span>
          Resetting...
        } @else {
          <i class="bi bi-shield-check me-2"></i>
          Reset Password
        }
      </button>

      <p class="text-center mt-3 mb-0">
        <a routerLink="/login" class="text-muted small">
          <i class="bi bi-arrow-left me-1"></i>
          Back to Login
        </a>
      </p>

    </div>
  </div>
</div>
